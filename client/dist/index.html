    <!--
      One font file, and everything else is a system stack.

      Fraunces is the warm serif the headings are set in; the body sans and the
      mono are whatever the reader's machine already has, which is both faster
      and, on a phone, better hinted than anything that could be downloaded.
      preconnect because the request is on the critical path for the hero, and
      display=swap because a heading that arrives late is better than a heading
      that is invisible while it loads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- The hero painting is the largest thing above the fold; ask for it
         before the bundle has parsed and picked the same file. -->
    <link
      rel="preload"
      as="image"
      href="/assets/site/map_hub-wide.jpg"
      imagesrcset="/assets/site/map_hub-narrow.jpg 720w, /assets/site/map_hub-wide.jpg 1440w"
    />

    <style>
      /* Just enough to paint the right colour before the bundle arrives. */
      html, body { margin: 0; background: #14101a; color: #f3e9d2; }
      body { font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #site-boot { padding: 6rem 1.15rem; text-align: center; color: #9a8f7a; }
    </style>
