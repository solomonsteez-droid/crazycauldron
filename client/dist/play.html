<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the notch does not letterbox the map; the UI
         keeps clear of it with env(safe-area-inset-*) instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>CrazyCauldron</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f3e9d2;
        --dim: #9a8f7a;
        --bg: #14101a;
        --accent: #7ce08a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        /* A phone keyboard or URL bar must not be able to scroll the world
           out from under the canvas. */
        overscroll-behavior: none;
        touch-action: manipulation;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #game { position: fixed; inset: 0; }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        /* Without this a drag across the map scrolls the page and a
           double-tap zooms it, and neither gesture reaches the game. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The UI layer floats over the canvas; scenes toggle its children. */
      #ui {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #ui > * { pointer-events: auto; }
      #boot {
        text-align: center;
        color: var(--dim);
      }
      #boot strong { display: block; color: var(--ink); font-size: 18px; letter-spacing: 0.08em; }
    </style>
    <script type="module" crossorigin src="/assets/play-D80IpX7K.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/motionMath-CCTYOCVr.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="ui">
      <div id="boot"><strong>CRAZYCAULDRON</strong>warming the cauldron&hellip;</div>
    </div>
  </body>
</html>
